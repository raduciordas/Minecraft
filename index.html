<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #app { width: 100%; height: 100%; }
      #app canvas { display: block; }

      #crosshair {
        position: fixed; left: 50%; top: 50%;
        width: 20px; height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none; z-index: 10;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: rgba(255, 255, 255, 0.85);
        mix-blend-mode: difference;
      }
      #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
      #crosshair::after { left: 0; top: 9px; width: 20px; height: 2px; }

      #hotbar {
        position: fixed; left: 50%; bottom: 12px;
        transform: translateX(-50%);
        display: flex; gap: 4px;
        padding: 4px; background: rgba(0, 0, 0, 0.35);
        border-radius: 6px; z-index: 10;
        pointer-events: none;
      }
      .hotbar-slot {
        width: 48px; height: 48px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .hotbar-slot.selected { border-color: #fff; background: rgba(255, 255, 255, 0.15); }
      .hotbar-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
      .hotbar-slot .key {
        position: absolute; top: 1px; left: 3px;
        font: 10px monospace; color: rgba(255, 255, 255, 0.8);
        text-shadow: 1px 1px 0 #000;
      }
      .hotbar-slot .count {
        position: absolute; bottom: 1px; right: 3px;
        font: bold 11px monospace; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
      .hotbar-slot.empty canvas { opacity: 0.3; }

      #inventory {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        z-index: 15;
      }
      #inventory.hidden { display: none; }
      .inv-panel {
        background: rgba(28, 28, 28, 0.95);
        border: 2px solid #999; border-radius: 8px;
        padding: 18px 20px;
      }
      .inv-title { color: #fff; font: 13px monospace; margin-bottom: 12px; }
      .inv-grid { display: grid; grid-template-columns: repeat(4, 72px); gap: 8px; }
      .inv-cell {
        height: 72px;
        border: 2px solid #666; border-radius: 4px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        cursor: pointer;
      }
      .inv-cell:hover { border-color: #fff; background: rgba(255, 255, 255, 0.08); }
      .inv-cell canvas { width: 32px; height: 32px; image-rendering: pixelated; }
      .inv-cell .name { font: 9px monospace; color: #bbb; }
      .inv-cell .cnt { font: 10px monospace; color: #fff; }

      #underwater {
        position: fixed; inset: 0;
        background: rgba(25, 70, 160, 0.38);
        pointer-events: none; z-index: 5;
      }
      #underwater.hidden { display: none; }

      #fps {
        position: fixed; top: 8px; left: 8px;
        font: 12px monospace; color: #fff;
        text-shadow: 1px 1px 0 #000;
        z-index: 10; pointer-events: none;
      }

      #overlay {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff; font-family: monospace;
        z-index: 20; cursor: pointer;
        text-align: center;
      }
      #overlay h1 { font-size: 42px; letter-spacing: 2px; }
      #overlay p { font-size: 14px; line-height: 1.8; color: #ccc; }
      #overlay.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <div id="fps"></div>
    <div id="inventory" class="hidden"></div>
    <div id="underwater" class="hidden"></div>
    <div id="overlay">
      <h1>MINECRAFT</h1>
      <p>
        Click to play<br /><br />
        WASD — move &nbsp;|&nbsp; Space — jump / swim &nbsp;|&nbsp; Mouse — look<br />
        Left click — break (collects the block) &nbsp;|&nbsp; Right click — place from inventory<br />
        1-7 / scroll — select block &nbsp;|&nbsp; E — inventory &nbsp;|&nbsp; F — fly &nbsp;|&nbsp; Esc — pause<br />
        Progress is saved automatically in your browser.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
